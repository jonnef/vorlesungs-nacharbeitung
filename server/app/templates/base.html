<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Vorlesungen{% endblock %}</title>
<style>
  :root { --bg:#fafaf9; --fg:#1c1917; --muted:#78716c; --card:#fff; --line:#e7e5e4;
          --accent:#2563eb; --ok:#15803d; --warn:#b45309; --err:#b91c1c; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#1c1917; --fg:#f5f5f4; --muted:#a8a29e; --card:#292524; --line:#44403c;
            --accent:#60a5fa; --ok:#4ade80; --warn:#fbbf24; --err:#f87171; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg);
         font:16px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  header { border-bottom:1px solid var(--line); padding:12px 16px; display:flex; gap:16px;
           align-items:center; flex-wrap:wrap; }
  header a { color:var(--fg); text-decoration:none; font-weight:600; }
  header .budget { margin-left:auto; color:var(--muted); font-size:14px; }
  main { max-width:900px; margin:0 auto; padding:16px; }
  a { color:var(--accent); }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px;
          padding:16px; margin:16px 0; overflow-x:auto; }
  table { border-collapse:collapse; width:100%; font-size:15px; }
  th, td { text-align:left; padding:6px 8px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { color:var(--muted); font-weight:500; }
  .muted { color:var(--muted); font-size:14px; }
  .status { font-size:13px; padding:2px 8px; border-radius:99px; border:1px solid currentColor; white-space:nowrap; }
  .s-done { color:var(--ok); } .s-submitted { color:var(--accent); }
  .s-estimated, .s-blocked { color:var(--warn); } .s-failed { color:var(--err); }
  .warn { color:var(--warn); } .err { color:var(--err); }
  button, input[type=submit] { font:inherit; padding:6px 14px; border-radius:8px; cursor:pointer;
          border:1px solid var(--accent); background:var(--accent); color:#fff; }
  button.secondary { background:transparent; color:var(--accent); }
  input[type=text] { font:inherit; padding:6px 10px; border-radius:8px; border:1px solid var(--line);
          background:var(--bg); color:var(--fg); }
  form.inline { display:inline; }
  .notes { line-height:1.65; overflow-wrap:anywhere; }
  .notes h1 { font-size:1.6em; margin:0 0 .6em; }
  .notes h2 { font-size:1.3em; margin:1.6em 0 .5em; padding-bottom:.25em; border-bottom:1px solid var(--line); }
  .notes h3 { font-size:1.1em; margin:1.3em 0 .4em; }
  .notes ul, .notes ol { padding-left:1.4em; margin:.4em 0; }
  .notes li { margin:.25em 0; }
  .notes li > ul, .notes li > ol { margin:.15em 0; }
  .notes p { margin:.6em 0; }
  .notes blockquote { margin:.8em 0; padding:.2em 1em; border-left:3px solid var(--line); color:var(--muted); }
  .notes code { font-family:ui-monospace, monospace; font-size:.9em; background:var(--bg);
                padding:.1em .35em; border-radius:4px; border:1px solid var(--line); }
  .notes pre { background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:12px; overflow-x:auto; }
  .notes pre code { border:0; padding:0; background:none; }
  .notes table { margin:.8em 0; display:block; overflow-x:auto; }
  .notes .math.block { margin:.8em 0; overflow-x:auto; overflow-y:hidden; }
  .notes .ts { font-family:ui-monospace, monospace; font-size:13px; color:var(--accent); white-space:nowrap; }
  .notes .page { font-size:13px; color:var(--ok); white-space:nowrap; }
  .glossary-tools { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
  .glossary-tools input[type=search] { flex:1 1 220px; font:inherit; padding:6px 10px; border-radius:8px;
          border:1px solid var(--line); background:var(--bg); color:var(--fg); }
  .filters { display:flex; flex-wrap:wrap; gap:6px; }
  button.filter.active { background:var(--accent); color:#fff; }
  .glossary .letter { margin:1.4em 0 .3em; }
  .glossary .entry { margin:10px 0; }
  .glossary .entry p { margin:.4em 0; }
  .entry-head .kind { font-size:12px; color:var(--muted); border:1px solid var(--line); border-radius:99px; padding:1px 8px; margin-left:4px; }
  .sources { font-size:14px; margin-top:6px; display:flex; flex-direction:column; gap:2px; }
  details summary { cursor:pointer; }
  .transcript { font-size:14px; max-height:480px; overflow-y:auto; }
  .transcript .ts { font-family:ui-monospace, monospace; color:var(--muted); margin-right:6px; }
</style>
</head>
<body>
<header>
  <a href="/">Vorlesungen</a>
  <a href="/kosten">Kosten</a>
  <span class="budget">{{ b.model }} · {{ "%.2f"|format(b.spent) }} von {{ "%.2f"|format(b.budget) }} USD
    diesen Monat{% if b.reserved > 0 %} (+{{ "%.2f"|format(b.reserved) }} reserviert){% endif %}</span>
</header>
<main>
{% block content %}{% endblock %}
</main>
</body>
</html>
